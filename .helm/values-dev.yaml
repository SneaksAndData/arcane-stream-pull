# Local kind / e2e overrides for the arcane-stream-pull chart.
#
# Usage (from the repo root):
#   just kind-up
# or manually:
#   helm upgrade --install arcane-stream-pull .helm -f .helm/values.yaml -f .helm/values-dev.yaml
#
# Assumes the data-plane manifests under deploy/k8s/ have been applied to the same
# namespace, providing in-cluster Services named minio, lakekeeper, dynamodb-local,
# trino, postgres. The plugin pod reaches them via cluster DNS — no host networking.

image:
  repository: "arcane-stream-dynamodb"
  tag: "latest"
  pullPolicy: "IfNotPresent"

# We're not deploying the arcane-operator in this dev cluster, so the JobTemplate
# would never be picked up. Skip rendering it to keep the release minimal.
jobTemplateSettings:
  create: false

# StreamClass / StreamingJobTemplate require operator-side CRDs that aren't
# installed in the local kind cluster. Skip them.
streamClass:
  create: false

devRunner:
  enabled: true

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

  # STREAMCONTEXT__SPEC mirrors the JSON the legacy docker-compose stack injected
  # into the plugin container. All endpoints now resolve via in-cluster DNS.
  config:
    STREAMCONTEXT__SPEC: |
      {
        "backfillJobTemplateRef": {"apiGroup":"streaming.sneaksanddata.com","kind":"StreamingJobTemplate","name":"noop"},
        "jobTemplateRef":        {"apiGroup":"streaming.sneaksanddata.com","kind":"StreamingJobTemplate","name":"noop"},
        "observability": {"metricTags": {}},
        "staging": {
          "table": {"maxRowsPerFile": 10000, "stagingCatalogName": "iceberg", "stagingSchemaName": "test", "isUnifiedSchema": false},
          "icebergCatalog": {"catalogProperties": {}, "catalogUri": "http://lakekeeper:8181/catalog", "namespace": "test", "warehouse": "demo", "maxCatalogInstanceLifetime": "3600 second"}
        },
        "streamMode": {
          "backfill": {"backfillBehavior": "Overwrite", "backfillStartDate": "2026-01-01T00:00:00Z"},
          "changeCapture": {"changeCaptureInterval": "2 second", "changeCaptureJitterVariance": 0.1, "changeCaptureJitterSeed": 0}
        },
        "sink": {
          "mergeServiceClient": {
            "connectionUrl": "jdbc:trino://trino:8080",
            "credentialType": {"basic": {}},
            "extraConnectionParameters": {"clientTags": "e2e"},
            "queryRetryMode": {"never": {}},
            "queryRetryBaseDuration": "100 millisecond",
            "queryRetryOnMessageContents": [],
            "queryRetryScaleFactor": 0.1,
            "queryRetryMaxAttempts": 3
          },
          "targetTableProperties": {"format": "PARQUET", "sortedBy": [], "parquetBloomFilterColumns": []},
          "targetTableFullName": "iceberg.test.arcane_ingestion",
          "maintenanceSettings": {
            "targetOptimizeSettings": {"batchThreshold": 60, "fileSizeThreshold": "512MB"},
            "targetOrphanFilesExpirationSettings": {"batchThreshold": 60, "retentionThreshold": "6h"},
            "targetSnapshotExpirationSettings":   {"batchThreshold": 60, "retentionThreshold": "6h"},
            "targetAnalyzeSettings":              {"includedColumns": [], "batchThreshold": 60}
          },
          "icebergCatalog": {"catalogProperties": {}, "catalogUri": "http://lakekeeper:8181/catalog", "namespace": "test", "warehouse": "demo", "maxCatalogInstanceLifetime": "3600 second"}
        },
        "throughput": {
          "shaperImpl": {"memoryBound": {"fallbackStringTypeSizeEstimate": 50, "objectTypeSizeEstimate": 4096, "chunkCostScale": 1, "chunkCostMax": 10, "tableRowCountWeight": 0.05, "tableSizeWeight": 0.05, "tableSizeScaleFactor": 1}},
          "advisedRate": "1000 per 1 second", "advisedBurst": 1000, "advisedChunkSize": 10
        },
        "source": {
          "configuration": {
            "sourceTableName":     "arcane_ingestion",
            "targetTableName":     "iceberg.test.arcane_ingestion",
            "primaryKeyFieldName": "producer",
            "primaryKeyValue":     "consumer1",
            "watermarkFieldName":  "timestampUTC",
            "region":              "us-east-1",
            "tableName":           "arcane_ingestion",
            "endpoint":            "http://dynamodb-local:8000"
          },
          "buffering":          {"enabled": false, "strategy": {}},
          "fieldSelectionRule": {"essentialFields": [], "rule": {"all": {}}, "isServerSide": false}
        }
      }
