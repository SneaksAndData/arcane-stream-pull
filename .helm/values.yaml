replicaCount: 1

image:
  # Repository to pull the image from
  repository: "ghcr.io/sneaksanddata/arcane-stream-dynamodb"

  # Tag to pull (defaults to the chart appVersion)
  tag: ""

  # Image pull policy
  pullPolicy: "IfNotPresent"

# Image pull secrets for private repositories
imagePullSecrets: [ ]

# Override the application name
nameOverride: ""

# Fullname override
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: { }
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# CRD configuration
customResourceDefinitions:

  # Set to true to create CRDs for this operator
  # Otherwise, the operator will expect the CRDs to be pre-installed
  create: true

# StreamClass configuration. Requires the arcane-operator CRDs
# (streamclasses.streaming.sneaksanddata.com, streamingjobtemplates.streaming.sneaksanddata.com)
# to be pre-installed. Disable for local dev / e2e clusters that don't run the operator.
streamClass:
  create: true

rbac:
  # Specifies whether RBAC resources should be created
  clusterRole:

    # Allows the service account to list and view custom resources
    dynamodbStreamViewer:
      additionalLabels: { }
      additionalAnnotations: { }
      create: true
      nameOverride: ""

    # Allows the service account to update custom resources
    dynamodbStreamEditor:
      additionalLabels: { }
      additionalAnnotations: { }
      create: true
      nameOverride: ""

    # Allows the streaming plugin to report schema mismatch status for the Operator
    jobEditor:
      additionalLabels: { }
      additionalAnnotations: { }
      create: true
      nameOverride: ""

    # This parameter determines whether role binding resources need to be created.
    # If you have any roles in your configuration set to 'true', then this parameter for creating role binding resources
    # should also be set to 'true'.
  clusterRoleBindings:
    additionalLabels: { }
    additionalAnnotations: { }
    create: true 

# Additional labels for the stream classes
additionalLabels: { }
# Example:
#
#  app.my-company.com/name: arcane-stream
#  app.my-company.com/component: streaming

# Additional labels for the stream classes
additionalAnnotations: { }
# Example:
#
#  app.my-company.com/name: arcane-stream
#  app.my-company.com/source: restapi
#  app.my-company.com/application: arcane

jobTemplateSettings:
  create: true

  # Job backoff limit
  backoffLimit: 3

  # Additional labels for the streaming jobs and pods
  additionalLabels: { }
  # Example:
  #
  #  app.my-company.com/name: arcane-stream
  #  app.my-company.com/component: streaming

  # Additional labels for the streaming jobs and pods
  additionalAnnotations: { }
  # Example:
  #
  #  app.my-company.com/name: arcane-stream
  #  app.my-company.com/source: restapi
  #  app.my-company.com/application: arcane

  # Extra environment variables to set in the the streaming job
  extraEnv: [ ]
  # Example:
  #
  #  - name: APPLICATION_ENVIRONMENT
  #    value: Production

  # Extra environment variables referencing a ConfigMap or Secret
  extraEnvFrom: [ ]
  # Example:
  #
  #  envFrom:
  #    - configMapRef:
  #        name: custom-api-access-token

  # Extra volumes to add to the streaming job
  extraVolumes: [ ]
  # Example:
  #
  #  - name: data-volume
  #    emptyDir:
  #      sizeLimit: 500Mi

  # Extra volumes to add to the streaming job
  extraVolumeMounts: [ ]
  # Example:
  #
  #  - mountPath: /data
  #    name: data-volume

  # Resources constraints. By default, the operator does not specify any constraints to allow for easier deployment
  resources: { }
  # Example:
  #
  #  requests:
  #    cpu: 1
  #    memory: 1Gi
  #  limits:
  #    cpu: 1
  #    memory: 1Gi

  # Node labels for pod assignment
  tolerations: [ ]

  # Node labels for pod assignment
  affinity: { }

  # Security context settings for the pod
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault

  # Security context settings for the container
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true


  # Allows to specify a custom settings for pod failure policy
  podFailurePolicySettings:

    # Specifies the list of exit codes that should trigger a retry without incrementing the retry count
    retryOnExitCodes:
      # The stream container completes with this exit code when a retryable error occurs
      # Like rate by the server limiting, transient connection errors etc.
      - 2

# Long-running "dev runner" Pod for local kind / e2e use. In production the operator
# launches the plugin from `jobTemplateSettings` per DynamodbStream CR; this section
# bypasses that and runs the assembly jar directly, equivalent to the docker-compose
# `arcane-stream-pull` service in the legacy arcane-e2e stack.
#
# Disabled by default — opt in via values-dev.yaml.
devRunner:
  enabled: false

  # Image override for the runner (defaults to the chart image when empty).
  image:
    repository: ""
    tag: ""
    pullPolicy: "IfNotPresent"

  # Pod-level overrides.
  replicaCount: 1
  resources: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  # Plain env vars merged into the container (in addition to the secret below).
  extraEnv: []

  # Stream context + framework config exposed via a Secret. Keys land as env vars
  # on the runner pod. STREAMCONTEXT__SPEC must be a JSON string matching
  # PluginStreamContext (see IntegrationTests.streamContextJson).
  config:
    STREAMCONTEXT__STREAM_ID: "dev"
    STREAMCONTEXT__STREAM_KIND: "DynamodbStream"
    APPLICATION_VERSION: "0.0.0"
    AWS_ACCESS_KEY_ID: "minioadmin"
    AWS_SECRET_ACCESS_KEY: "minioadmin"
    AWS_REGION: "us-east-1"
    AWS_ENDPOINT_URL_S3: "http://minio:9000"
    ARCANE_FRAMEWORK__S3_CATALOG_ACCESS_KEY_ID: "minioadmin"
    ARCANE_FRAMEWORK__S3_CATALOG_SECRET_ACCESS_KEY: "minioadmin"
    ARCANE_FRAMEWORK__S3_CATALOG_ENDPOINT: "http://minio:9000"
    ARCANE_FRAMEWORK__CATALOG_NO_AUTH: "1"
    ARCANE_FRAMEWORK__MERGE_SERVICE_CONNECTION_URI: "jdbc:trino://trino:8080/iceberg/test?user=test"
    ARCANE_FRAMEWORK__JDBC_MERGE_SERVICE_USER: "user"
    ARCANE_FRAMEWORK__JDBC_MERGE_SERVICE_PASSWORD: ""
    DYNAMODB_ENDPOINT: "http://dynamodb-local:8000"
    STREAMCONTEXT__SPEC: ""

  # Wait for the iceberg target table to exist before the JVM starts. The plugin
  # crashes on boot if its target table is missing (ingestion-zio creates it lazily
  # from the DataRoute), so we restart-loop until trino can describe it.
  waitForTable:
    enabled: true
    catalog: "iceberg"
    schema: "test"
    table: "arcane_ingestion"
    trinoUrl: "http://trino:8080"
    timeoutSeconds: 15
