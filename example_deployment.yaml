apiVersion: streaming.sneaksanddata.com/v1
kind: PullStream
metadata:
  name: test-pull-stream
  namespace: stream-pull
spec:
  execution:
    backfillJobTemplateRef:
      kind: StreamingJobTemplate
      name: arcane-stream-pull-medium-10
      namespace: stream-pull
    layoutVersion: v1
    streamingBackend:
      changeCapture:
        jobTemplateRef:
          kind: StreamingJobTemplate
          name: arcane-stream-pull-medium-10
          namespace: stream-pull
    suspended: true
  observability:
    metricTags: {}
  staging:
    table:
      maxRowsPerFile: 10000
      stagingCatalogName: iceberg
      stagingSchemaName: lakehouse_staging.arcane_pull_test
      isUnifiedSchema: false
    icebergCatalog:
      catalogProperties: {}
      catalogUri: http://catalog-internal.data-catalog.svc.cluster.local:8181/catalog
      namespace: lakehouse_bronze.arcane_pull_test
      warehouse: staging
      maxCatalogInstanceLifetime: 3600 second
  streamMode:
    backfill:
      backfillBehavior: Overwrite
      backfillStartDate: '2026-01-01T00:00:00Z'
    changeCapture:
      changeCaptureInterval: 5 second
      changeCaptureJitterVariance: 0.1
      changeCaptureJitterSeed: 0
      changeCaptureRangeLimit: 100
  sink:
    mergeServiceClient:
      connectionUrl: "jdbc:trino://trino-backfill.awsp.sneaksanddata.com"
      credentialType:
        basic: {}
      extraConnectionParameters:
        clientTags: test
      queryRetryMode:
        never: {}
      queryRetryBaseDuration: 100 millisecond
      queryRetryOnMessageContents: []
      queryRetryScaleFactor: 0.1
      queryRetryMaxAttempts: 3
    targetTableProperties:
      format: PARQUET
      sortedBy: []
      parquetBloomFilterColumns: []
    targetTableFullName: lakehouse_bronze.arcane_pull_test.events
    maintenanceSettings:
      targetOptimizeSettings:
        batchThreshold: 60
        fileSizeThreshold: 512MB
      targetOrphanFilesExpirationSettings:
        batchThreshold: 60
        retentionThreshold: 6h
      targetSnapshotExpirationSettings:
        batchThreshold: 60
        retentionThreshold: 6h
      targetAnalyzeSettings:
        includedColumns: []
        batchThreshold: 60
    icebergCatalog:
      catalogProperties: {}
      catalogUri: http://localhost:8181/catalog
      namespace: arcane_pull_test
      warehouse: lakehouse-bronze
      maxCatalogInstanceLifetime: 3600 second
  throughput:
    shaperImpl:
      memoryBound:
        fallbackStringTypeSizeEstimate: 50
        objectTypeSizeEstimate: 4096
        chunkCostScale: 1
        chunkCostMax: 10
        tableRowCountWeight: 0.05
        tableSizeWeight: 0.05
        tableSizeScaleFactor: 1
        chunkSizeCap: 1000000
        maxStatisticsAge: 604800
    advisedRate: "1000 per 1 second"
    advisedBurst: 1000
    advisedChunkSize: 10
  source:
    configuration:
      pullIndexKey: producer
      pullIndexValue: producer1
      watermarkFieldName: timestampUTC
      region: eu-central-1
      tableName: arcane_ingestion
      endpoint: http://dynamodb-local:8000
    buffering:
      enabled: false
      strategy: {}
    fieldSelectionRule:
      essentialFields: []
      rule:
        all: {}
      isServerSide: false
