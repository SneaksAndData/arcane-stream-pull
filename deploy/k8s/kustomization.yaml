# Kind data-plane bundle for arcane-stream-pull / arcane-ingestion-zio e2e.
#
# Apply with:
#   kubectl apply -k deploy/k8s
# or:
#   just kind-data-up
#
# Resources land in the current namespace (default). Service names are the
# in-cluster DNS aliases the plugin chart and arcane-ingestion-zio chart point at
# (see .helm/values-dev.yaml / arcane-ingestion-zio/.helm/values-dev.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - minio.yaml
  - postgres.yaml
  - lakekeeper.yaml
  - dynamodb-local.yaml
  - trino.yaml
  - bootstrap.yaml
