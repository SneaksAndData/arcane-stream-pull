# Bootstrap the lakekeeper warehouse + namespaces. Equivalent to
# arcane-push-stream's deploy/integration/bootstrap-lakekeeper.py. The target
# iceberg table is still created by arcane-push-stream from its DataRoute CR and
# the staging table by arcane-stream-pull; we only seed the prerequisite
# warehouse/namespaces here so that creation succeeds.
#
# Two namespaces are created:
#   test            - arcane-stream-pull staging tables
#   arcane_pull_test - target tables provisioned from prod_dataroute_variant.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: bootstrap-lakekeeper
data:
  bootstrap.py: |
    import os, sys, time, requests

    LK_BASE   = os.environ.get("LK_BASE", "http://lakekeeper:8181")
    WAREHOUSE = "demo"
    NAMESPACES = ["test", "arcane_pull_test"]

    def wait_for_lakekeeper():
        deadline = time.time() + 180
        while time.time() < deadline:
            try:
                if requests.get(f"{LK_BASE}/health", timeout=2).ok:
                    return
            except requests.RequestException:
                pass
            print("waiting for lakekeeper..."); time.sleep(2)
        sys.exit("lakekeeper did not become healthy")

    def ensure_bootstrap():
        r = requests.post(
            f"{LK_BASE}/management/v1/bootstrap",
            json={"accept-terms-of-use": True},
        )
        if r.status_code not in (200, 400):
            r.raise_for_status()

    def ensure_warehouse():
        r = requests.post(
            f"{LK_BASE}/management/v1/warehouse",
            json={
                "warehouse-name": WAREHOUSE,
                "project-id": "00000000-0000-0000-0000-000000000000",
                "storage-profile": {
                    "type": "s3",
                    "bucket": "tmp",
                    "key-prefix": "initial-warehouse",
                    "assume-role-arn": None,
                    "endpoint": "http://s2:9000",
                    "region": "us-east-1",
                    "path-style-access": True,
                    "flavor": "s3-compat",
                    "sts-enabled": False,
                },
                "storage-credential": {
                    "type": "s3",
                    "credential-type": "access-key",
                    "aws-access-key-id": "minioadmin",
                    "aws-secret-access-key": "minioadmin",
                },
            },
        )
        if r.status_code not in (200, 201, 400, 409):
            r.raise_for_status()

    def warehouse_prefix():
        # Lakekeeper keys REST routes on the warehouse UUID. Resolve it through the
        # standard /v1/config negotiation instead of hard-coding an id.
        config = requests.get(
            f"{LK_BASE}/catalog/v1/config", params={"warehouse": WAREHOUSE}
        ).json()
        prefix = config.get("overrides", {}).get("prefix") or config.get("defaults", {}).get("prefix")
        if not prefix:
            raise RuntimeError(f"catalog did not return a prefix for warehouse '{WAREHOUSE}'")
        return prefix

    def ensure_namespaces():
        prefix = warehouse_prefix()
        for namespace in NAMESPACES:
            r = requests.post(
                f"{LK_BASE}/catalog/v1/{prefix}/namespaces",
                json={"namespace": [namespace], "properties": {}},
            )
            if r.status_code not in (200, 201, 409):
                r.raise_for_status()
            print(f"warehouse={WAREHOUSE} namespace={namespace} ready")

    if __name__ == "__main__":
        wait_for_lakekeeper()
        ensure_bootstrap()
        ensure_warehouse()
        ensure_namespaces()
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-lakekeeper
  labels: { app: bootstrap }
spec:
  backoffLimit: 10
  template:
    metadata: { labels: { app: bootstrap } }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: python:3.11-slim-bookworm
          command:
            - /bin/sh
            - -ec
            - |
              pip install --quiet --no-cache-dir requests
              python /scripts/bootstrap.py
          volumeMounts:
            - { name: scripts, mountPath: /scripts, readOnly: true }
      volumes:
        - name: scripts
          configMap:
            name: bootstrap-lakekeeper
