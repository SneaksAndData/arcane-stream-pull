# dynamodb-local — same image the arcane-ingestion-zio integration tests use.
# In-memory + sharedDb, so the table state survives until pod restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamodb-local
  labels: { app: dynamodb-local }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: dynamodb-local } }
  template:
    metadata: { labels: { app: dynamodb-local } }
    spec:
      containers:
        - name: dynamodb
          image: amazon/dynamodb-local
          args: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
          ports:
            - { name: ddb, containerPort: 8000 }
          readinessProbe:
            tcpSocket: { port: 8000 }
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dynamodb-local
  labels: { app: dynamodb-local }
spec:
  selector: { app: dynamodb-local }
  ports:
    - { name: ddb, port: 8000, targetPort: 8000 }
