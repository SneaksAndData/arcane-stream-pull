version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: sbt
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: weekly
      day: "monday"
    groups:
      sbt:
        patterns:
          - "*"
