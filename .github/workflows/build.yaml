name: Run tests with coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  PROJECT_NAME: Arcane.Stream.Pull
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate_commit:
    name: Validate commit
    runs-on: ubuntu-latest
    if: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      id-token: write      # required for dependabot PRs
      pull-requests: write # required for dependabot PRs
      contents: read       # required for dependabot PRs
      checks: write        # required for cobertura-action
      packages: read       # required for building the SBT project
      code-quality: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Scala
        uses: japgolly/setup-everything-scala@v4.1
        with:
          java-version: temurin:1.25.0.2
      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Build the Docker Compose stack
        run: |
          just up --quiet-pull
          docker compose -f test-resources/docker-compose.yaml wait s2_ready s3_reader_prepare lakekeeper_migrate lakekeeper_prepare
      - name: Get Compose Logs
        if: always()
        run: just logs

      - name: Build and test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: just test "clean; coverage; Test/testFull; coverageReport"

      - name: Validate formatting
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: just fmt-check

      - name: Locate coverage report
        id: coverage
        shell: bash
        run: |
          report_path=$(find target -maxdepth 7 -path "*/coverage-report/cobertura.xml" -print -quit)
          if [ -z "$report_path" ]; then
            echo "::error::Could not locate cobertura.xml under target/**/coverage-report/"
            exit 1
          fi
          echo "report_path=$report_path" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-code-coverage@v1
        with:
          fail-on-error: false
          file: ${{ steps.coverage.outputs.report_path }}
          language: Java
          label: code-coverage/jacoco

