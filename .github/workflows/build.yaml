name: Run tests with coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  PROJECT_NAME: Arcane.Stream.Pull
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate_commit:
    name: Validate commit
    runs-on: ubuntu-latest
    if: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      id-token: write      # required for dependabot PRs
      pull-requests: write # required for dependabot PRs
      contents: read       # required for dependabot PRs
      checks: write        # required for cobertura-action
      packages: read       # required for building the SBT project
      code-quality: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Scala
        uses: japgolly/setup-everything-scala@v4.1
        with:
          java-version: temurin:1.25.0.2
      - name: Build the Docker Compose stack
        run: |
          docker compose up --quiet-pull -d
          docker compose wait prepare_buckets s3_reader_prepare lakekeeper_migrate lakekeeper_prepare
      - name: Get Compose Logs
        if: always()
        run: docker compose logs

      - name: Build and test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          export $(cat integration-tests.env | xargs)
          sbt clean coverage test coverageReport

      - name: Validate formatting
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: sbt scalafmtCheckAll

      - uses: actions/upload-code-coverage@v1
        with:
          file: target/scala-3.8.3/coverage-report/cobertura.xml
          language: Java
          label: code-coverage/jacoco

