name: Release a new version

on: workflow_dispatch

jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    # if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create Release
        uses: SneaksAndData/github-actions/semver_release@6fffbe2f4e71b0dc842680fbf3bbb3b6f018f529
        with:
          major_v: 0
          minor_v: 4
