name: Release a new version

on: workflow_dispatch

jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    # if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create Release
        uses: SneaksAndData/github-actions/semver_release@b52bd005ee52ec0ca7f2773a2d856c363bf61322
        with:
          major_v: 0
          minor_v: 4
