name: "arcane-stream-pull"

services:
  s2:
    container_name: s2
    hostname: s2-test
    network_mode: host
    image: mojatter/s2-server
    restart: always
    environment:
      - S2_SERVER_USER=minioadmin
      - S2_SERVER_PASSWORD=minioadmin
      - S2_SERVER_BUCKETS=tmp,lakehouse,s3-blob-reader,s3-blob-reader-json,s3-blob-reader-json-variable,s3-blob-reader-json-nested-array
  # s2-server image has no shell/curl, so readiness is probed from a sidecar.
  # Buckets are created before the S3 API starts listening, so healthy == buckets exist.
  s2_ready:
    container_name: s2-ready
    image: curlimages/curl
    network_mode: host
    restart: "no"
    depends_on:
      - s2
    command: [ "--retry", "30", "--retry-delay", "2", "--retry-all-errors", "-fsS", "http://localhost:9000/healthz" ]
  s3_reader_prepare:
    image: python:3.11-slim-bookworm
    network_mode: host
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_ENDPOINT_URL_S3=http://localhost:9000
    depends_on:
      s2_ready:
        condition: service_completed_successfully
    restart: "no"
    volumes:
      - ./scripts/populate-s3-reader-bucket.py:/populate-s3-reader-bucket.py
    command: [ "/bin/sh", "-c", "pip install boto3 pandas pyarrow fastparquet && python /populate-s3-reader-bucket.py"  ]

  trino:
    depends_on:
      lakekeeper:
        condition: service_healthy
    network_mode: host
    image: "trinodb/trino:474"
    volumes:
      - ./integration-tests.properties:/etc/trino/catalog/iceberg.properties
  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.11.4
    network_mode: host
    environment:
#      - LAKEKEEPER__PG_ENCRYPTION_KEY=This-is-NOT-Secure!
      - LAKEKEEPER__LISTEN_PORT=20001
      - LAKEKEEPER__METRICS_PORT=20002
      - LAKEKEEPER__BASE_URI=http://localhost:20001
      - ICEBERG_REST__BASE_URI=http://localhost:20001
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://postgres:postgres@localhost:5432/postgres
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://postgres:postgres@localhost:5432/postgres
      - RUST_LOG=trace,axum=trace,sqlx=trace,iceberg-catalog=trace
    command: [ "serve" ]
    healthcheck:
      test: [ "CMD", "/home/nonroot/lakekeeper", "healthcheck" ]
      interval: 1s
      timeout: 10s
      retries: 30
    depends_on:
      lakekeeper_migrate:
        condition: service_completed_successfully
      lakekeeper_db:
        condition: service_healthy
      s2_ready:
        condition: service_completed_successfully
  lakekeeper_migrate:
    image: quay.io/lakekeeper/catalog:v0.11.4
    network_mode: host
    environment:
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://postgres:postgres@localhost:5432/postgres
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://postgres:postgres@localhost:5432/postgres
      - RUST_LOG=info
    restart: "no"
    command: [ "migrate" ]
    depends_on:
      lakekeeper_db:
        condition: service_healthy
  lakekeeper_prepare:
    image: python:3.11-slim-bookworm
    network_mode: host
    environment:
      CATALOG_HOST: localhost
      CATALOG_WAREHOUSE: demo
    depends_on:
      lakekeeper:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./scripts/bootstrap-lk.py:/bootstrap-lk.py
    command: [ "/bin/sh", "-c", "pip install requests && python /bootstrap-lk.py"  ]
  dynamodb-local:
    container_name: dynamodb-local
    image: amazon/dynamodb-local
    network_mode: host
    command: [ "-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory" ]
    healthcheck:
      test: [ "CMD-SHELL", "java -version >/dev/null 2>&1" ]
      interval: 5s
      timeout: 5s
      retries: 5
  lakekeeper_db:
    image: postgres:16.3-bullseye
    network_mode: host
    restart: always
    environment:
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_DB=postgres
      - PGHOST=localhost
      - PGPORT=5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -p 5432 -d postgres" ]
      interval: 2s
      timeout: 30s
      retries: 8
